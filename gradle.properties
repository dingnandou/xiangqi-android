org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=36

# 工程路径含中文（E:\Codex\project\中国象棋），AGP 在 Windows 上默认直接拒绝。
# 这里显式放行。若后续 M2/M3 出现路径相关的诡异失败（尤其 NDK/CMake 阶段），
# 第一嫌疑就是这条开关，处置方式是改用纯 ASCII 路径重新 clone 或建立目录联接。
# 详见 PROJECT_STATUS.md「已知限制」。
android.overridePathCheck=true

kotlin.code.style=official